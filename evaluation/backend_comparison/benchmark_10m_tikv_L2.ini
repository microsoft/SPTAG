; 10M TiKV backend benchmark, Layers=2 — used to validate PR 447 bug fixes
; 1 PD + 1 TiKV on local node
[Benchmark]
VectorPath=/mnt_ssd/data/sift1b/bigann_base.u8bin
QueryPath=/mnt_ssd/data/sift1b/query.10K.u8bin
TruthPath=/mnt_ssd/data/sift1b/bigann_truth.bin
IndexPath=/mnt_ssd/data/proidx_10m_tikv_L2/spann_index
ValueType=UInt8
Dimension=128
BaseVectorCount=9000000
InsertVectorCount=1000000
DeleteVectorCount=0
BatchNum=10
TopK=5
NumSearchThreads=4
NumInsertThreads=16
NumQueries=200
DistMethod=L2
Rebuild=true
BuildOnly=false
Resume=-1
Layers=2

Storage=TIKVIO
TiKVKeyPrefix=sptag_10m_tikv_L2
TiKVPDAddresses=127.0.0.1:2379

[SelectHead]
ParallelBKTBuild=true

[BuildHead]
ParallelBKTBuild=true

[BuildSSDIndex]
VersionCacheTTLMs=0
VersionCacheMaxChunks=100000
UseMultiChunkPosting=false
AppendThreadNum=48
AsyncMergeInSearch=true
LatencyLimit=100
