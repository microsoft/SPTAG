; Replace all absolute input/index paths before running.
; This results-only report does not include the measured source fixes or binary.
[Benchmark]
VectorPath=/absolute/path/to/sift-first-10m.u8bin
QueryPath=/absolute/path/to/query.10K.u8bin
TruthPath=perftest_batchtruth.L2.UInt8_9900000_128_10000_5_10000_0_10
IndexPath=/absolute/path/to/new-fileio-run/index
ValueType=UInt8
Dimension=128
BaseVectorCount=9900000
InsertVectorCount=100000
DeleteVectorCount=0
BatchNum=10
TopK=5
NumSearchThreads=32
NumInsertThreads=16
NumSearchDuringInsertThreads=0
NumQueries=10000
DistMethod=L2
Rebuild=true
Resume=-1
Layers=1

[SelectHead]
NumberOfThreads=80

[BuildHead]
NumberOfThreads=80
MaxCheck=8192

[BuildSSDIndex]
Storage=FILEIO
NumberOfThreads=80
PostingPageLimit=4
SearchPostingPageLimit=4
BufferLength=4
SearchInternalResultNum=64
LatencyLimit=50
AppendThreadNum=48
MaxCheck=8192
; TiKV-only switch retained from the template; FILEIO uses a local VersionMap.
SearchCheckVersionMapOnlyLayer0=true
