; =============================================================================
; Native SPANN .ini build config for the attribute-aware (multi-tenant) builder.
;
; Run with:   ./Release/spannbuilder -c <this file>
;
; Single source of truth for the build (mirrors the old run_opq25_native.sh
; env-soup, but in SPANN's native sectioned .ini format read by Helper::IniReader,
; the same loader the classic IndexBuilder uses):
;   * standard [BuildSSDIndex] params flow through the native SetSSDBuildParam
;     parameter system (ReplicaCount / file sizing / posting quantizer / rerank);
;   * the multi-tenant ACL routing + unfilter-enhancement extensions (no native
;     SPANN param) live in [MultiTenant]/[SelectHead]/[BuildHead] and are
;     delivered to their existing getenv consumers.
; An explicit CLI flag still overrides any value here.
; Comments MUST start with ';'. IniReader does NOT strip inline comments, so a
; value line must contain ONLY the value (no trailing ';...').
;
; NOT build params (kept in the launcher run_spann_attr_build.sh): process-loader
; env (LD_PRELOAD jemalloc, GLIBC_TUNABLES) + post-build augmentheadgraph.
; =============================================================================

[Base]
; Vector source (mmapped, zero-copy). VectorOffset skips the .i8bin header.
VectorPath=/datadisk/yfcc_fast/spacev_base_3m.i8bin
VectorOffset=8
VectorCount=3000000
Dim=100
VectorType=Int8
DistCalcMethod=L2
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/spacev_smoke3m_opq25

[Tags]
; Per-vector attribute columns (4 ACL + 1 numeric). uint32, row-major.
TagFile=/tmp/spacev_tags5_3m.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false

[SelectHead]
; PerTagBKT head selection; Ratio = target final head ratio (0.1 = 10%).
SelectType=PerTagBKT
Ratio=0.1

[BuildHead]
; Head-index (BKT) KNN graph build threads. Leave SelectHead at its default 4.
NumberOfThreads=24

[BuildSSDIndex]
; native SPANN posting-store params (applied via SetSSDBuildParam)
Storage=FILEIO
ReplicaCount=8
; in-posting OPQ quantization: posting record = [meta | M-byte OPQ code]
PostingQuantizer=OPQ
PostingQuantM=25
PostingQuantizerFile=/datadisk/yfcc_fast/spacev_opq25_sidecar/opq_codes_m25.bin
; cold-rerank full-precision base + survivor depth
FullVectorFile=/datadisk/yfcc_fast/spacev_base_3m.i8bin
RerankL=150
; SSD block-pool sizing (GB), pinned explicitly (bypasses the auto estimate).
; 3M: Start=8 Max=32 (real ~1.2GB).  1B: Start=420 Max=560 (real ~388GB).
StartFileSizeGB=8
MaxFileSizeGB=32

[MultiTenant]
; ACL routing + numeric attribute layout (categorical cols 0-3, numeric col 4)
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/tmp/spacev_group_tags.txt
; PivotForceNodeCount=4
; Unfilter-enhancement layers (ALL THREE must stay on; see AGENTS.md). Layer (1)
; cross-graph is the post-build augmentheadgraph step, gated by CrossEdges below
; (the launcher reads CrossEdges/CrossExtraEdges and runs augmentheadgraph -m N).
;   CrossEdges=1       -> stitch per-node head bundles (head_cross_edges.bin)
;   CrossEdges=0       -> skip; unfilter falls back to per-node fan-out
;   CrossExtraEdges=N  -> cross-subgraph edges kept per head (-m; <=0 -> 10)
CrossEdges=1
CrossExtraEdges=10
; SelectHead resume checkpoint (avoids re-running the BKT head selection on a failed
; BuildHead/BuildSSDIndex). PersistSelectHead=1 writes head_select_state.bin after
; SelectHead and keeps per-node head vector files (slightly larger index). To resume,
; re-run the launcher with ResumeBuild=1 (keeps the index dir, reloads the checkpoint,
; skips the BKT). Default off = original one-shot behavior.
PersistSelectHead=1
ResumeBuild=0
; In-place build: write directly into IndexDirectory/tenant_0 (no /tmp staging + copy).
; The StartFileSizeGB block pool is pre-allocated in the final dir's filesystem.
InPlaceBuild=1
DualPoolAugment=1
DualPoolExtraRatio=0.1
UnfilterTailKReplica=2
UnfilterTailBufferPages=2
