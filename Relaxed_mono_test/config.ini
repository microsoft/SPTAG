[Relaxedmono]
mode = random
initialCount = 500
appendCount = 200
numThreads = 4
indexPath = ./index_output
appendBatchSize = 10
appendRatePerSec = 1
testDurationSec = 300
logIntervalSec = 10
queryKs = 100

[random]
dimensions = 100
seed = 42

[SPANN]
IndexAlgoType = BKT
DistCalcMethod = L2
SelectHeadThreads = 4
SelectHeadRatio = 0.2
BuildHeadThreads = 4
RefineIterations = 3
BuildSSDIndexThreads = 4
UseKV = true
KVPath = ./index_output_kv_path/
SsdInfoFile = ./index_output_ssdinfo/info.bin
BuildSSDIndex = true
PostingPageLimit = 1000
SearchPostingPageLimit = 12
InternalResultNum = 64
SearchInternalResultNum = 64
