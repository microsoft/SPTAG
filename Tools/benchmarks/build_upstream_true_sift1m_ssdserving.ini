; Direct reproduction of Microsoft SIFT1M SSDServing settings, adapted only
; to the local 24-core host and NVMe output path.

[Base]
ValueType=Float
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
VectorPath=/home/v-mochengli/datasets/sift1m/sift/sift_base.fvecs
VectorType=XVEC
QueryPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
QueryType=XVEC
WarmupPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
WarmupType=XVEC
TruthPath=/home/v-mochengli/datasets/sift1m/sift/sift_groundtruth.ivecs
TruthType=XVEC
IndexDirectory=/datadisk/yfcc_fast/sptag_upstream_true_sift1m

[SelectHead]
isExecute=true
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=50
SplitFactor=6
SplitThreshold=100
Ratio=0.16
NumberOfThreads=24
BKTLambdaFactor=-1

[BuildHead]
isExecute=true
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
MaxCheck=8192
MaxCheckForRefineGraph=8192
RefineIterations=3
NumberOfThreads=24
BKTLambdaFactor=-1

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
InternalResultNum=64
ReplicaCount=8
PostingPageLimit=12
NumberOfThreads=24
MaxCheck=8192
TmpDir=/datadisk/yfcc_fast/sptag_upstream_true_sift1m_tmp
StartFileSizeGB=4
MaxFileSizeGB=8
GrowthFileSizeGB=1

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=32
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
MaxDistRatio=8.0
SearchPostingPageLimit=12
