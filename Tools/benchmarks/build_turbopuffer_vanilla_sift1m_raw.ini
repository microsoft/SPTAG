; TurboPuffer baseline: vanilla raw-vector SIFT1M SPANN.
; Deliberately excludes PerTagBKT, multi-tenant routing, cross edges, tails,
; ordered-page metadata, quantization, and reranking. Its unfilter is expected
; to match original SPANN except for any deliberate tagged-record I/O overhead.

[Base]
ValueType=Float
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
VectorPath=/home/v-mochengli/datasets/sift1m/sift/sift_base.fvecs
VectorType=XVEC
QueryPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
QueryType=XVEC
WarmupPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
WarmupType=XVEC
TruthPath=/home/v-mochengli/datasets/sift1m/sift/sift_groundtruth.ivecs
TruthType=XVEC
IndexDirectory=/datadisk/yfcc_fast/sptag_turbopuffer_vanilla_sift1m_raw

[SelectHead]
isExecute=true
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=50
SplitFactor=6
SplitThreshold=100
Ratio=0.16
NumberOfThreads=24
BKTLambdaFactor=-1
SelectHeadType=BKT

[BuildHead]
isExecute=true
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
MaxCheck=8192
MaxCheckForRefineGraph=8192
RefineIterations=3
NumberOfThreads=24
BKTLambdaFactor=-1

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
Storage=STATIC
InternalResultNum=64
ReplicaCount=8
TailReplicaCount=0
UnfilterTailBufferLength=0
PostingPageLimit=12
NumberOfThreads=24
MaxCheck=8192
TmpDir=/datadisk/yfcc_fast/sptag_turbopuffer_vanilla_sift1m_raw_tmp
StartFileSizeGB=4
MaxFileSizeGB=8
GrowthFileSizeGB=1
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
PostingQuantizer=None
Rerank=0
RerankL=0

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=32
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
MaxDistRatio=8.0
SearchPostingPageLimit=12
