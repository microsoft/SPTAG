; =============================================================================
; Canonical SIFT1B/SpaceV1B comparison build: PipePQ32, no U_extra,
; official SIFT1B SPANN construction settings, and one unfilter-tail page.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
VectorOffset=8
VectorCount=1000000000
Dim=128
VectorType=UInt8
DistCalcMethod=L2
IndexAlgoType=BKT
Normalized=false
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_pipepq32_r010_tail1

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false

[SelectHead]
SelectHeadType=PerTagBKT
Ratio=0.12
BKTLambdaFactor=1.0
ParallelBKTBuild=true
NumberOfThreads=45
SelectThreshold=10
SplitFactor=6
SplitThreshold=25

[BuildHead]
NumberOfThreads=45
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
MaxCheck=16324
MaxCheckForRefineGraph=16324
RefineIterations=3

[BuildSSDIndex]
Storage=FILEIO
NumberOfThreads=45
InternalResultNum=64
ReplicaCount=8
PostingPageLimit=3
MaxCheck=16324
TmpDir=/tmp/
TailReplicaCount=8
UnfilterTailBufferLength=1
PostingQuantizer=PipePQ
PostingQuantM=32
PostingQuantizerFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_pq_compressed.bin
PipePQPivotsFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_pq_pivots.bin
FullVectorFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
RerankL=500
StartFileSizeGB=800
MaxFileSizeGB=1200
GrowthFileSizeGB=50

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=96
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=1024
MaxDistRatio=8.0
SearchPostingPageLimit=3
UnifiedNprobeBudget=true
MultiNodeBudgetKeepRatio=0.60
CrossSingleSeed=-1
DisableCrossEdges=false
FilterKeepCross=false
CrossExpandLimit=0
DisableCrossSubgraph=false
LogUExtra=false
LogCrossStats=false
LogPathStats=false
DumpHeads=0
FilterKeepUExtra=false
EnableUnfilterTail=true
AblateUExtra=false
AblateTail=false
UnfilterPurePages=false
UnfilterExtraTailPages=0
EnableHierPostingFilter=false

[MultiTenant]
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_group_tags.txt
PivotForceNodeCount=4
CrossEdges=1
CrossExtraEdges=10
InPlaceBuild=1
PersistSelectHead=1
ResumeBuild=0
DualPoolAugment=0
DualPoolExtraRatio=0.1
