; =============================================================================
; Recommended SIFT1B raw-vector STM1 profile, derived from the current SIFT1M
; static ordered-page configuration.
;
; This deliberately stores the original UInt8 vectors in STATIC postings:
; no PipePQ, OPQ, RaBitQ, or exact rerank. Pure STM1 prefixes are sorted for
; team/project DNF page pruning; unfilter tails remain unsorted after pure data.
;
; Capacity: one STM1 record is 152 bytes (VID + five uint32 tags + 128 bytes).
; Eight pure and up to eight unfilter-tail replicas require a multi-TB final
; filesystem. InPlaceBuild avoids a second full static snapshot during SaveAll.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
VectorOffset=8
VectorCount=1000000000
Dim=128
VectorType=UInt8
DistCalcMethod=L2
IndexAlgoType=KDT
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_raw_static_tail_unbounded_ordered_page

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false
ShareBuildOwnership=false

[SelectHead]
SelectHeadType=PerTagBKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=true
NumberOfThreads=45
SelectThreshold=6
SplitFactor=5
SplitThreshold=25

[BuildHead]
NumberOfThreads=45
TPTNumber=16
TPTLeafSize=2000
NeighborhoodSize=32
GraphNeighborhoodScale=2
GraphCEFScale=2
RefineIterations=2
MaxCheckForRefineGraph=8192
MaxCheck=8192
HashTableExponent=2

[BuildSSDIndex]
Storage=STATIC
NumberOfThreads=45
InternalResultNum=64
PostingPageLimit=16
PostingVectorLimit=118
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=-1
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableOrderedPageStart=true
OrderedPageStartAttrs=2,3
EnableDataCompression=false
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=None
Rerank=0
RerankL=0
EnableHierPostingFilter=false

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=62
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=4096
MaxDistRatio=10000
SearchPostingPageLimit=17
UnifiedNprobeBudget=true
MultiNodeBudgetKeepRatio=0.60
CrossSingleSeed=-1
DisableCrossEdges=false
FilterKeepCross=false
CrossExpandLimit=0
DisableCrossSubgraph=false
LogUExtra=false
LogCrossStats=false
LogPathStats=false
DumpHeads=0
FilterKeepUExtra=false
EnableUnfilterTail=true
AblateUExtra=false
AblateTail=false
UnfilterPurePages=false
UnfilterExtraTailPages=0
EnableHierPostingFilter=true

[MultiTenant]
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_group_tags.txt
PivotForceNodeCount=4
CrossEdges=1
CrossExtraEdges=10
InPlaceBuild=1
DualPoolAugment=0
DualPoolExtraRatio=0
