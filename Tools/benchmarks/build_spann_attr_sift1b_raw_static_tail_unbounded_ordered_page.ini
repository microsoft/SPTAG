; =============================================================================
; Recommended SIFT1B raw-vector STM1 profile. It adopts the current SIFT1M
; static ordered-page posting layout while retaining SIFT1B's original BKT
; head-build and search parameters from docs/GettingStart.md.
;
; This deliberately stores the original UInt8 vectors in STATIC postings:
; no PipePQ, OPQ, RaBitQ, or exact rerank. Pure STM1 prefixes are sorted for
; team/project DNF page pruning; unfilter tails remain unsorted after pure data.
;
; Capacity: one STM1 record is 152 bytes (VID + five uint32 tags + 128 bytes).
; Eight pure and up to eight unfilter-tail replicas require a multi-TB final
; filesystem. InPlaceBuild avoids a second full static snapshot during SaveAll.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
VectorOffset=8
VectorCount=1000000000
Dim=128
VectorType=UInt8
DistCalcMethod=L2
IndexAlgoType=BKT
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_raw_static_tail_unbounded_ordered_page

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false
ShareBuildOwnership=true

[SelectHead]
isExecute=true
SelectHeadType=PerTagBKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
Ratio=0.12
BKTLambdaFactor=1.0
ParallelBKTBuild=true
NumberOfThreads=45
SelectThreshold=10
SplitFactor=6
SplitThreshold=25

[BuildHead]
isExecute=true
NumberOfThreads=45
TPTNumber=32
TPTLeafSize=2000
NeighborhoodSize=32
MaxCheckForRefineGraph=16324
MaxCheck=16324
RefineIterations=3
BKTLambdaFactor=-1.0

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
Storage=STATIC
NumberOfThreads=45
InternalResultNum=64
PostingPageLimit=6
PostingVectorLimit=118
ReplicaCount=8
MaxCheck=16324
TailReplicaCount=8
UnfilterTailBufferLength=-1
; Build cross edges before Phase 4 so tail uses one owner-seeded unified traversal.
CrossEdges=1
CrossExtraEdges=10
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableOrderedPageStart=true
OrderedPageStartAttrs=2,3
EnableDataCompression=false
SSDIndexFileNum=1
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=None
Rerank=0
RerankL=0
EnableHierPostingFilter=false
; tags5 is [org, dept, team, project, price]. Keep price inline for DNF/range
; filtering, but exclude it from legacy flat ACL matching.
StaticACLTagCols=4
TmpDir=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_raw_static_tail_unbounded_ordered_page_tmp

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=96
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=1024
MaxDistRatio=8.0
SearchPostingPageLimit=3
UnifiedNprobeBudget=true
MultiNodeBudgetKeepRatio=0.60
CrossSingleSeed=-1
DisableCrossEdges=false
FilterKeepCross=false
CrossExpandLimit=0
DisableCrossSubgraph=false
LogUExtra=false
LogCrossStats=false
LogPathStats=false
DumpHeads=0
FilterKeepUExtra=false
EnableUnfilterTail=true
AblateUExtra=false
AblateTail=false
UnfilterPurePages=false
UnfilterExtraTailPages=0
EnableHierPostingFilter=true

[MultiTenant]
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_group_tags.txt
PivotForceNodeCount=4
InPlaceBuild=1
PersistSelectHead=1
ResumeBuild=1
DualPoolAugment=0
DualPoolExtraRatio=0
