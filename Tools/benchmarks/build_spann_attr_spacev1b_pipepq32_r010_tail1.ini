; =============================================================================
; Canonical SIFT1B/SpaceV1B comparison build: PipePQ32, no U_extra,
; PerTagBKT Ratio=0.1, and one extra unfilter-tail page beyond each pure prefix.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_base.i8bin
VectorOffset=8
VectorCount=1000000000
Dim=100
VectorType=Int8
DistCalcMethod=L2
Normalized=true
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_spann_pipepq32_r010_tail1

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_build/spacev1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false

[SelectHead]
SelectType=PerTagBKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=true
NumberOfThreads=64

[BuildHead]
NumberOfThreads=64

[BuildSSDIndex]
Storage=FILEIO
NumberOfThreads=64
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=1
PostingQuantizer=PipePQ
PostingQuantM=32
PostingQuantizerFile=/mnt/nvme/baotonglu/mocheng/pipeann/spacev1b/spacev1b_pq_compressed.bin
PipePQPivotsFile=/mnt/nvme/baotonglu/mocheng/pipeann/spacev1b/spacev1b_pq_pivots.bin
FullVectorFile=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_base.i8bin
RerankL=500
StartFileSizeGB=600
MaxFileSizeGB=800
GrowthFileSizeGB=50

[MultiTenant]
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/mnt/nvme/baotonglu/mocheng/datasets/spacev1b/spacev1b_build/spacev1b_group_tags.txt
PivotForceNodeCount=4
CrossEdges=1
CrossExtraEdges=10
InPlaceBuild=1
PersistSelectHead=1
ResumeBuild=0
DualPoolAugment=0
DualPoolExtraRatio=0.1
