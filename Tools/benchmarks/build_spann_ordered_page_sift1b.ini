; =============================================================================
; Fresh SIFT1B raw-STATIC PerTagBKT SPANN with ordered STM1 page starts.
;
; This is the next SPANN candidate, distinct from the retained no-order
; Turbopuffer-style control. It partitions by the categorical hierarchy, sorts
; each pure posting prefix by team/project, and persists ordered_page_starts.bin
; for single-clause DNF equality filters. Eight unbounded unfilter-tail replicas
; retain cross-partition recall. It must build a new index; do not repack or
; mutate the existing STM1 snapshot.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
VectorOffset=8
VectorCount=1000000000
Dim=128
VectorType=UInt8
DistCalcMethod=L2
IndexAlgoType=BKT
Normalized=false
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_ordered_page_pertag_r08

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false

[SelectHead]
SelectHeadType=PerTagBKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=10
SplitFactor=6
SplitThreshold=25
Ratio=0.12
BKTLambdaFactor=1.0
ParallelBKTBuild=true
NumberOfThreads=45

[BuildHead]
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
MaxCheck=16324
MaxCheckForRefineGraph=16324
RefineIterations=3
NumberOfThreads=45
BKTLambdaFactor=-1.0

[BuildSSDIndex]
Storage=STATIC
; tags5 is [org, dept, team, project, price]. The numeric price is embedded
; but excluded from flat ACL matching and ordered hierarchy page starts.
StaticACLTagCols=4
EnableOrderedPageStart=true
OrderedPageStartAttrs=2,3
EnablePostingListRearrange=false
EnableDataCompression=false
EnableDeltaEncoding=false
SSDIndexFileNum=1
TailReplicaCount=8
UnfilterTailBufferLength=-1
PostingQuantizer=None
RerankL=0
InternalResultNum=64
ReplicaCount=8
PostingPageLimit=3
MaxCheck=16324
NumberOfThreads=45
TmpDir=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_ordered_page_pertag_r08_tmp

[SearchSSDIndex]
InternalResultNum=96
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=1024
MaxDistRatio=8.0
SearchPostingPageLimit=3
EnableUnfilterTail=true
EnableHierPostingFilter=true

[MultiTenant]
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_group_tags.txt
PivotForceNodeCount=4
InPlaceBuild=1
PersistSelectHead=1
ResumeBuild=0
CrossEdges=1
CrossExtraEdges=10
DualPoolAugment=0
DualPoolExtraRatio=0
