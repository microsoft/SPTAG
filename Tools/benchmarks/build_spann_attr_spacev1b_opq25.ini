; =============================================================================
; Native SPANN .ini build config -- SPACEV-1B, attribute-aware (multi-tenant),
; in-posting OPQ-25, all three unfilter-enhancement layers ON.
;
;   Run:  Tools/benchmarks/run_spann_attr_build.sh \
;             Tools/benchmarks/build_spann_attr_spacev1b_opq25.ini
;         (internally: Release/spannbuilder -c <this file>  +  augmentheadgraph)
;
; This is the BILLION-scale sibling of build_spann_attr_spacev_opq25.ini (3M).
; It is the single source of truth for the 1B build, in SPANN's native sectioned
; .ini format (read by Helper::IniReader). See AGENTS.md -> "Build Config --
; Native .ini" for the full key->engine mapping. Comments MUST start with ';';
; inline comments are NOT stripped, so value lines carry ONLY the value.
;
; -----------------------------------------------------------------------------
; REPRODUCIBILITY -- the three derived builder inputs referenced below are NOT
; in the repo (they are 20-25 GB each). Regenerate them deterministically with:
;
;   Tools/benchmarks/prep_spacev1b_inputs.sh        ; full 1B  (or pass N for a smoke subset)
;
; Pure C++ (no Python): the script drives spannbuilder subcommands that mimic
; AnnService/src/Quantizer/main.cpp (IQuantizer::LoadIQuantizer + QuantizeVector),
; so the artifacts are byte-for-byte what the build/search trust:
;   --merge-tags5   tags.npy[1B,4]+num_attr.npy[1B] -> spacev1b_tags5.u32 [1B,5]
;                   + spacev1b_group_tags.txt (org col, PerTagBKT routing key)
;   --gen-opq-codes base i8bin + 3M-trained codebook -> opq_codes_m25.bin
;                   (raw widen, ADC=false, header-less N*M; the in-posting
;                    convention -- NOT the normalizing generic Release/quantizer)
; Outputs land under /datadisk/yfcc_fast/spacev1b_build/ (+ a copy of the
; 3M-trained opq_quantizer.bin for search-time ADC).
; Source dataset (committed): /home/v-mochengli/datasets/big-ann/MSSPACEV1B/
;   spacev1b_base.i8bin [1B,100] int8  +  multitenant/{tags.npy,num_attr.npy}
; =============================================================================

[Base]
; 1B x 100 int8 base; VectorOffset=8 skips the (n,d) int32 header.
VectorPath=/datadisk/yfcc_fast/spacev1b_base.i8bin
VectorOffset=8
VectorCount=1000000000
Dim=100
VectorType=Int8
DistCalcMethod=L2
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/spacev1b_opq25

[Tags]
; 5 uint32 cols/vec: [org,dept,team,project] (ACL) + price (numeric).
TagFile=/datadisk/yfcc_fast/spacev1b_build/spacev1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false

[SelectHead]
; PerTagBKT routing-key = group_tags (org level, 4 groups). Ratio = final head %.
SelectType=PerTagBKT
Ratio=0.1
; BKT balance factor: AUTO (-1) runs DynamicFactorSelect, which sample-searches the
; lambda that MINIMIZES cluster-count std (most BALANCED tree). Pinning a fixed value
; (e.g. 100) makes the effective balance penalty negligible vs int8 L2 distances (~1e12),
; degenerating into ONE mega-cluster -> pathologically deep, unbalanced tree that never
; finishes. The auto-search is only ~14 sample-based full scans/group -> cheap on NVMe.
BKTLambdaFactor=100

[BuildHead]
NumberOfThreads=24

[BuildSSDIndex]
; native SPANN posting-store params (applied via SetSSDBuildParam)
Storage=FILEIO
ReplicaCount=8
; in-posting OPQ quantization: posting record = [meta | 25-byte OPQ code]
PostingQuantizer=OPQ
PostingQuantM=25
PostingQuantizerFile=/datadisk/yfcc_fast/spacev1b_build/opq_codes_m25.bin
; cold-rerank full-precision base (the 1B i8bin) + survivor depth
FullVectorFile=/datadisk/yfcc_fast/spacev1b_base.i8bin
RerankL=150
; SSD block-pool sizing (GB), pinned explicitly (bypasses the auto estimate).
; Slim record ~= 25 + 5*4 + 32 = 77 B; 1B*77*~5 replicas ~= 388 GB real posting
; data. Start=420/Max=560 fits the 761 GB /datadisk NVMe alongside the head index.
StartFileSizeGB=420
MaxFileSizeGB=560

[MultiTenant]
; ACL routing (categorical cols 0-3) + numeric attr (col 4). Hier widths match the
; dataset's tag_level_cardinalities [4,16,64,256].
; NumericCols = COUNT of TRAILING numeric columns (numBaseCols = NumTagsPerVec -
; NumericCols). Here col4=price is the only numeric -> NumericCols=1 leaves cols 0-3
; as the 4 categorical ACL levels. (Setting 4 would wrongly make dept/team/project
; numeric, leaving only org categorical and misaligning HierLevelWidths.)
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/datadisk/yfcc_fast/spacev1b_build/spacev1b_group_tags.txt
; Unfilter-enhancement layers (ALL THREE stay on; see AGENTS.md). Layer (1)
; cross-graph is the post-build augmentheadgraph step, gated by CrossEdges below
; (the launcher reads CrossEdges/CrossExtraEdges and runs augmentheadgraph -m N).
;   CrossEdges=1       -> stitch per-node head bundles (head_cross_edges.bin)
;   CrossEdges=0       -> skip; unfilter falls back to per-node fan-out
;   CrossExtraEdges=N  -> cross-subgraph edges kept per head (-m; <=0 -> 10)
CrossEdges=1
CrossExtraEdges=10
; SelectHead resume checkpoint (avoids re-running the BKT head selection on a failed
; BuildHead/BuildSSDIndex). PersistSelectHead=1 writes head_select_state.bin after
; SelectHead and keeps per-node head vector files (slightly larger index). To resume,
; re-run the launcher with ResumeBuild=1 (keeps the index dir, reloads the checkpoint,
; skips the BKT). Default off = original one-shot behavior.
PersistSelectHead=1
ResumeBuild=0
; In-place build: write the SPANN index DIRECTLY into IndexDirectory/tenant_0 instead
; of staging in /tmp and copying at the end. Avoids the transient 2x disk footprint
; (work dir + final dir) and the final copy -- essential at billion scale. The SSD
; block pool (StartFileSizeGB) is pre-allocated in the final dir, so IndexDirectory's
; filesystem must have room for it (here /datadisk, 420-560GB).
InPlaceBuild=1
DualPoolAugment=1
DualPoolExtraRatio=0.1
UnfilterTailKReplica=2
UnfilterTailBufferPages=2
