; One-global-BKT SIFT1M limited-tag posting experiment.
; Every head supports its own attribute plus one external attribute selected
; from non-head nearest-head votes. Filtered queries scan H; unfiltered queries
; scan the complete original O in the single persisted H | (O \ H) posting.

[Base]
ValueType=Float
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
VectorPath=/home/v-mochengli/datasets/sift1m/multitenant/pipeann/sift_base.bin
VectorOffset=8
VectorCount=1000000
VectorType=Float
QueryPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
QueryType=XVEC
WarmupPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
WarmupType=XVEC
TruthPath=/home/v-mochengli/datasets/sift1m/sift/sift_groundtruth.ivecs
TruthType=XVEC
IndexDirectory=/datadisk/yfcc_fast/sptag_sift1m_zipf200/index_limited_tag

[Tags]
TagFile=/datadisk/yfcc_fast/sptag_sift1m_zipf200/sift1m_zipf200_tags.u32
TagOffset=0
NumTagsPerVec=1
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false
ShareBuildOwnership=true

[SelectHead]
isExecute=true
SelectHeadType=BKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=50
SplitFactor=6
SplitThreshold=100
Ratio=0.16
BKTLambdaFactor=-1
ParallelBKTBuild=false
NumberOfThreads=24

[BuildHead]
isExecute=true
BKTNumber=1
BKTKmeansK=32
BKTLeafSize=8
Samples=1000
BKTLambdaFactor=-1
TPTNumber=32
TPTLeafSize=2000
NeighborhoodSize=32
RefineIterations=3
MaxCheck=8192
MaxCheckForRefineGraph=8192
NumberOfThreads=24

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
Storage=STATIC
NumberOfThreads=24
InternalResultNum=64
PostingPageLimit=16
PostingVectorLimit=118
ReplicaCount=8
RNGFactor=1
TailReplicaCount=8
UnfilterTailBufferLength=-1
UnfilterPureDistanceScanPercent=100
OutputEmptyReplicaID=false
ExcludeHead=true
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableOrderedPageStart=false
EnableDataCompression=false
SSDIndexFileNum=1
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false
PostingQuantizer=None
EnableHierPostingFilter=false
StaticACLTagCols=1
MaxCheck=8192
CrossEdges=0
EnableHybridDistance=false
EnableLimitedTagPosting=true
LimitedTagSlotsPerHead=2
LimitedTagVoteHeadCount=2
LimitedTagMinHeadCount=8
LimitedTagSupportFile=limited_tag_support.bin
TmpDir=/datadisk/yfcc_fast/sptag_sift1m_zipf200/tmp_limited_tag

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=62
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
MaxDistRatio=8
SearchPostingPageLimit=12
UnifiedNprobeBudget=true
DisableCrossEdges=true
FilterKeepCross=false
DisableCrossSubgraph=true
EnableUnfilterTail=true
UnfilterPurePages=false
UnfilterExtraTailPages=0
EnableHierPostingFilter=true

[MultiTenant]
ACLCols=0
HierLevelWidths=200
NumericCols=0
PivotForceNodeCount=1
CrossEdges=0
CrossExtraEdges=0
InPlaceBuild=true
DualPoolAugment=0
