; =============================================================================
; Canonical SIFT1B Turbopuffer-style control, implemented by SPTAG SPANN.
; This is not a PipeANN configuration or Turbopuffer's own implementation.
; It deliberately uses SPTAG's raw STATIC posting path and posting signatures.
;
; Construction/search parameters match the documented SIFT1B SPANN defaults in
; docs/GettingStart.md. Intentional architecture changes are limited to:
;   - one global BKT graph rather than PerTagBKT/subgraph routing;
;   - STATIC raw postings, with no in-posting PQ/OPQ or exact rerank;
;   - no unfilter-tail replicas.
;   - no ordered page-start layout; that requires a separately rebuilt index.
;
; BuildSignatures uses the existing shared signature pipeline. The static reader
; must consume its existing m_postingFilter callback rather than create a
; parallel signature sidecar.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
VectorOffset=8
VectorCount=1000000000
Dim=128
VectorType=UInt8
DistCalcMethod=L2
IndexAlgoType=BKT
Normalized=false
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_static_signature_r08

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false

[SelectHead]
SelectHeadType=BKT
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=10
SplitFactor=6
SplitThreshold=25
Ratio=0.12
BKTLambdaFactor=1.0
ParallelBKTBuild=true
NumberOfThreads=45

[BuildHead]
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
MaxCheck=16324
MaxCheckForRefineGraph=16324
RefineIterations=3
NumberOfThreads=45
BKTLambdaFactor=-1.0

[BuildSSDIndex]
Storage=STATIC
; tags5 is [org, dept, team, project, price]; price remains embedded in STM1
; records but is not an ACL column or a hierarchical posting-mask input.
StaticACLTagCols=4
EnableOrderedPageStart=false
InternalResultNum=64
ReplicaCount=8
PostingPageLimit=3
MaxCheck=16324
NumberOfThreads=45
TmpDir=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_static_signature_r08_tmp

[SearchSSDIndex]
InternalResultNum=96
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=1024
MaxDistRatio=8.0
SearchPostingPageLimit=3

[MultiTenant]
InPlaceBuild=1
PersistSelectHead=1
ResumeBuild=0
CrossEdges=0
