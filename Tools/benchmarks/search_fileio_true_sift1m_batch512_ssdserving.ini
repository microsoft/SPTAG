; Search-only A/B over the existing FileIO SIFT1M control. SpdkBatchSize=512
; exceeds the observed maximum of 290 4KB posting-page requests/query, so all
; requests fit in one AsyncFileIO submission batch.

[Base]
ValueType=Float
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
QueryPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
QueryType=XVEC
WarmupPath=/home/v-mochengli/datasets/sift1m/sift/sift_query.fvecs
WarmupType=XVEC
TruthPath=/home/v-mochengli/datasets/sift1m/sift/sift_groundtruth.ivecs
TruthType=XVEC
IndexDirectory=/datadisk/yfcc_fast/sptag_fileio_true_sift1m

[BuildSSDIndex]
isExecute=false
BuildSsdIndex=false
Storage=FILEIO
SpdkBatchSize=512

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=32
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=2048
MaxDistRatio=8.0
SearchPostingPageLimit=12
