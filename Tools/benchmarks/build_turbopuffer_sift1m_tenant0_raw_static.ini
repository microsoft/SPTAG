; TurboPuffer no-tag control for tenant0. Matches the tagged baseline's
; raw-vector BKT/SPANN construction, single static posting file, and no rerank.

[Base]
ValueType=Float
DistCalcMethod=Cosine
IndexAlgoType=KDT
Dim=128
VectorPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.fbin
VectorType=DEFAULT
VectorSize=404819
QueryPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_query_1000.fvecs
QueryType=XVEC
WarmupPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_query_1000.fvecs
WarmupType=XVEC
TruthPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_unfilter_top10_1000.truth.bin
TruthType=DEFAULT
IndexDirectory=/datadisk/yfcc_fast/sptag_turbopuffer_tenant0_raw_static

[SelectHead]
isExecute=true
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
BKTLambdaFactor=100
NumberOfThreads=16
SaveBKT=false
SelectThreshold=6
SplitFactor=5
SplitThreshold=25
SplitMaxTry=8
Ratio=0.1
RecursiveCheckSmallCluster=true
PrintSizeCount=true
SelectHeadType=BKT

[BuildHead]
isExecute=true
TPTNumber=16
TPTLeafSize=2000
NeighborhoodSize=32
GraphNeighborhoodScale=2
GraphCEFScale=2
RefineIterations=2
MaxCheckForRefineGraph=8192
NumberOfThreads=16
DistCalcMethod=Cosine
MaxCheck=8192
HashTableExponent=2

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
Storage=STATIC
NumberOfThreads=16
InternalResultNum=64
PostingPageLimit=15
PostingVectorLimit=118
ReplicaCount=8
TailReplicaCount=0
UnfilterTailBufferLength=0
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
PostingQuantizer=None
Rerank=0
RerankL=0
StartFileSizeGB=4
MaxFileSizeGB=8
GrowthFileSizeGB=1

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=20
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=4096
MaxDistRatio=10000
SearchPostingPageLimit=15
