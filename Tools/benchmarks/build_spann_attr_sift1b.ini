; =============================================================================
; Native SPANN .ini build config -- SIFT1B/BigANN, attribute-aware multi-tenant.
;
;   Run:  Tools/benchmarks/run_spann_attr_build.sh \
;             Tools/benchmarks/build_spann_attr_sift1b.ini
;
; Inputs are generated by:
;   Tools/benchmarks/gen_sift1b_attrs.py
;   Tools/benchmarks/prep_sift1b_inputs.sh
;
; PipeANN-aligned PQ32 build. PipeANN's native sidecars are generated by
; PipeANN/build/tests/generate_pq_codes:
;   sift1b_pq_pivots.bin and sift1b_pq_compressed.bin ([N,32]+codes).
; SPTAG embeds those exact 32-byte codes in postings and uses the same pivots
; for ADC. TailReplicaCount=8 with UnfilterTailBufferLength=1 retains at most
; one extra physical tail page beyond each pure prefix.
; =============================================================================

[Base]
VectorPath=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
VectorOffset=8
VectorCount=1000000000
Dim=128
VectorType=UInt8
DistCalcMethod=L2
Normalized=false
IndexDirectory=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_spann_pipepq32_tail8_page1

[Tags]
TagFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_tags5.u32
TagOffset=0
NumTagsPerVec=5
Tenant=0

[Build]
BuildSignatures=true
WithMetaIndex=false

[SelectHead]
SelectType=PerTagBKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=true
NumberOfThreads=64

[BuildHead]
NumberOfThreads=64

[BuildSSDIndex]
Storage=FILEIO
NumberOfThreads=64
ReplicaCount=8
TailReplicaCount=8
UnfilterTailBufferLength=1
PostingQuantizer=PipePQ
PostingQuantM=32
PostingQuantizerFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_pq_compressed.bin
PipePQPivotsFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_pq_pivots.bin
FullVectorFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_base.u8bin
RerankL=500
StartFileSizeGB=800
MaxFileSizeGB=1200
GrowthFileSizeGB=50

[MultiTenant]
ACLCols=0,1,2,3
HierLevelWidths=4,16,64,256
NumericCols=1
PerVectorTagsFile=/mnt/nvme/baotonglu/mocheng/datasets/sift1b/sift1b_build/sift1b_group_tags.txt
PivotForceNodeCount=4
CrossEdges=1
CrossExtraEdges=10
InPlaceBuild=1
DualPoolAugment=0
DualPoolExtraRatio=0.1
