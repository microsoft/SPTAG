; TurboPuffer no-tag twin built through spannbuilder/TenantIndexManager.
; It matches build_turbopuffer_sift1m_tenant0_tagged_raw_static.ini except
; that no per-vector tags are embedded in the raw static posting records.

[Base]
VectorPath=/datadisk/yfcc_fast/sptag_sift1m_tagged_vs_upstream/tenant0_base_normalized.f32
VectorOffset=0
VectorCount=404819
Dim=128
VectorType=Float
DistCalcMethod=Cosine
IndexAlgoType=KDT
Normalized=true
IndexDirectory=/datadisk/yfcc_fast/sptag_turbopuffer_tenant0_raw_static_manager

[Build]
BuildSignatures=false
WithMetaIndex=false
ShareBuildOwnership=false

[SelectHead]
SelectHeadType=BKT
Ratio=0.1
BKTLambdaFactor=100
ParallelBKTBuild=false
NumberOfThreads=16
SelectThreshold=6
SplitFactor=5
SplitThreshold=25

[BuildHead]
; Use the same fixed graph-build worker count in both A/B controls.
NumberOfThreads=1
TPTNumber=16
TPTLeafSize=2000
NeighborhoodSize=32
GraphNeighborhoodScale=2
GraphCEFScale=2
RefineIterations=2
MaxCheckForRefineGraph=8192
MaxCheck=8192
HashTableExponent=2

[BuildSSDIndex]
Storage=STATIC
NumberOfThreads=16
InternalResultNum=64
PostingPageLimit=15
PostingVectorLimit=118
ReplicaCount=8
TailReplicaCount=0
UnfilterTailBufferLength=0
OutputEmptyReplicaID=false
EnableDeltaEncoding=false
EnablePostingListRearrange=false
EnableDataCompression=false
PostingQuantizer=None
Rerank=0
RerankL=0
UseDirectIO=false
Batches=1
AsyncMergeInSearch=false

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=20
NumberOfThreads=1
HashTableExponent=4
ResultNum=10
MaxCheck=4096
MaxDistRatio=10000
SearchPostingPageLimit=15
EnableHierPostingFilter=false

[MultiTenant]
; Keep the manager topology as a normal one-root SPANN index.
DisablePivotEstimator=1
CrossEdges=0
InPlaceBuild=1
DualPoolAugment=0
DualPoolExtraRatio=0
